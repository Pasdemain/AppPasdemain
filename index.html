/* ── Jetons ─────────────────────────────────────────────────────────────────
   Palette reprise à l'identique de src/constants/theme.ts, pour que les deux
   versions de l'app soient visuellement la même application.               */
:root {
  --text: #0A1B2A;
  --text-secondary: #5A6B7B;
  --background: #F5F8FA;
  --surface: #FFFFFF;
  --surface-alt: #E8EFF4;
  --border: #D6E1E9;
  --primary: #0B3C5D;
  --primary-text: #FFFFFF;
  --accent: #1B94C4;
  --success: #1F8A4C;
  --success-surface: #E3F5EA;
  --danger: #C1272D;
  --danger-surface: #FBE7E8;
  --warning: #C97A00;

  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 16px; --sp-xl: 24px; --sp-2xl: 32px;
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-pill: 999px;
  --max: 720px;
  --nav-h: 64px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --text: #EAF2F7;
    --text-secondary: #9BAEBD;
    --background: #07131D;
    --surface: #0F2231;
    --surface-alt: #16303F;
    --border: #1E3B4D;
    --primary: #1B94C4;
    --primary-text: #04121B;
    --accent: #4FC3E8;
    --success: #3FBF77;
    --success-surface: #0E2F1F;
    --danger: #E8626A;
    --danger-surface: #331317;
    --warning: #E0A040;
  }
}
:root[data-theme="dark"] {
  --text: #EAF2F7;
  --text-secondary: #9BAEBD;
  --background: #07131D;
  --surface: #0F2231;
  --surface-alt: #16303F;
  --border: #1E3B4D;
  --primary: #1B94C4;
  --primary-text: #04121B;
  --accent: #4FC3E8;
  --success: #3FBF77;
  --success-surface: #0E2F1F;
  --danger: #E8626A;
  --danger-surface: #331317;
  --warning: #E0A040;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ── Ossature ────────────────────────────────────────────────────────────── */
#view {
  max-width: var(--max);
  margin: 0 auto;
  padding: calc(var(--sp-lg) + env(safe-area-inset-top)) var(--sp-lg)
           calc(var(--nav-h) + var(--sp-2xl) + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: var(--sp-lg);
}
#view.has-topbar { padding-top: var(--sp-lg); }
#view.no-nav { padding-bottom: calc(var(--sp-2xl) + env(safe-area-inset-bottom)); }

.topbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: var(--sp-md);
  margin: 0 calc(var(--sp-lg) * -1);
  padding: calc(var(--sp-md) + env(safe-area-inset-top)) var(--sp-lg) var(--sp-md);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.topbar h2 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; }
.iconbtn {
  appearance: none; border: 0; background: transparent; color: var(--primary);
  font: inherit; font-size: 15px; cursor: pointer; padding: var(--sp-sm);
  border-radius: var(--r-sm); min-height: 40px; min-width: 40px;
}
.iconbtn:active { opacity: .6; }

/* ── Typographie ─────────────────────────────────────────────────────────── */
.eyebrow {
  font-size: 12px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-secondary); margin: 0;
}
h1 { font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h3 { font-size: 21px; line-height: 1.25; font-weight: 700; margin: 0; text-wrap: balance; }
h4 { font-size: 17px; line-height: 1.3; font-weight: 600; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--text-secondary); }
.small { font-size: 13px; line-height: 1.5; }
.stack { display: flex; flex-direction: column; gap: var(--sp-xs); }
.stack-md { display: flex; flex-direction: column; gap: var(--sp-md); }
.num { font-variant-numeric: tabular-nums; }

/* ── Composants ──────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-lg);
  display: flex; flex-direction: column; gap: var(--sp-sm);
}
a.card, button.card {
  font: inherit; color: inherit; text-align: left; text-decoration: none;
  cursor: pointer; width: 100%;
}
a.card:active, button.card:active { opacity: .7; }

.btn {
  appearance: none; font: inherit; font-size: 17px; font-weight: 600;
  min-height: 52px; padding: var(--sp-md) var(--sp-xl);
  border-radius: var(--r-md); border: 1px solid transparent;
  background: var(--primary); color: var(--primary-text);
  cursor: pointer; width: 100%;
  display: inline-flex; align-items: center; justify-content: center;
}
.btn:active { opacity: .75; }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.secondary { background: var(--surface-alt); color: var(--text); }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--border); }

.bar { width: 100%; height: 8px; border-radius: var(--r-pill); background: var(--surface-alt); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: var(--r-pill); background: var(--accent); }
.bar.thin { height: 6px; }

.badge {
  display: inline-block; padding: var(--sp-xs) var(--sp-md);
  border-radius: var(--r-pill); font-size: 13px; font-weight: 700;
}
.badge.ok { background: var(--success-surface); color: var(--success); }
.badge.ko { background: var(--danger-surface); color: var(--danger); }

.row { display: flex; align-items: center; gap: var(--sp-sm); }
.row.between { justify-content: space-between; }
/* En-tête d'écran : le bouton de thème s'aligne en haut, pas sur la ligne de
   base d'un titre qui peut passer sur deux lignes. */
.head { align-items: flex-start; }
.head .iconbtn { margin-top: -6px; margin-right: -8px; }
.grow { flex: 1; min-width: 0; }

.keypoints {
  background: var(--surface-alt);
  border-left: 3px solid var(--accent);
  border-radius: var(--r-md);
  padding: var(--sp-lg);
  display: flex; flex-direction: column; gap: var(--sp-xs);
}
.keypoints ul { margin: 0; padding-left: 1.1em; }
.keypoints li { font-size: 13px; line-height: 1.6; }

.tag {
  background: var(--surface-alt); color: var(--warning);
  font-size: 13px; font-weight: 700;
  padding: var(--sp-sm) var(--sp-md); border-radius: var(--r-sm);
}

.stats { display: flex; gap: var(--sp-md); }
.stats > div { flex: 1; display: flex; flex-direction: column; gap: var(--sp-xs); }
.stats strong { font-size: 21px; font-weight: 700; }

.rowlist > * + * { border-top: 1px solid var(--border); }
.rowlist > * { padding: var(--sp-md) 0; display: flex; flex-direction: column; gap: var(--sp-sm); }
.rowlist > *:first-child { padding-top: 0; }
.rowlist > *:last-child { padding-bottom: 0; }

/* ── Réponses du QCM ─────────────────────────────────────────────────────── */
.opt {
  display: flex; align-items: flex-start; gap: var(--sp-md);
  width: 100%; text-align: left; font: inherit; color: inherit;
  padding: var(--sp-lg); border-radius: var(--r-md);
  border: 1.5px solid var(--border); background: var(--surface);
  cursor: pointer;
}
.opt:active { opacity: .7; }
.opt[disabled] { cursor: default; }
.opt .letter {
  flex: none; width: 26px; height: 26px; border-radius: var(--r-pill);
  border: 1.5px solid currentColor; display: grid; place-items: center;
  font-size: 13px; font-weight: 700;
}
.opt.correct { border-color: var(--success); background: var(--success-surface); }
.opt.wrong { border-color: var(--danger); background: var(--danger-surface); }

/* ── Barre d'onglets ─────────────────────────────────────────────────────── */
#nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;

const { THEMES, LESSONS, QUESTIONS, EXAM_LENGTH, EXAM_MAX_ERRORS } = DATA;

/* ── Utilitaires ─────────────────────────────────────────────────────────── */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const themeById = Object.fromEntries(THEMES.map((t) => [t.id, t]));
const pct = (v) => Math.round((Number.isFinite(v) ? v : 0) * 100);
const plural = (n, s = "s") => (n > 1 ? s : "");

function shuffle(items) {
  const a = items.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ── Progression : un objet JSON unique dans localStorage ────────────────── */
const KEY = "permis-bateau/progress/v1";
const EMPTY = { questions: {}, exams: [] };

function loadProgress() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return structuredClone(EMPTY);
    const parsed = JSON.parse(raw);
    return { questions: parsed.questions || {}, exams: parsed.exams || [] };
  } catch { return structuredClone(EMPTY); }
}
function saveProgress() {
  // Le stockage peut être refusé (navigation privée, iframe cloisonnée).
  // L'app doit rester utilisable, seule la persistance est perdue.
  try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch {}
}
let progress = loadProgress();

function recordAnswer(id, correct) {
  const s = progress.questions[id] || { seen: 0, correct: 0, lastCorrect: false };
  progress.questions[id] = {
    seen: s.seen + 1,
    correct: s.correct + (correct ? 1 : 0),
    lastCorrect: correct,
  };
  saveProgress();
}
function recordExam(total, correct, passed) {
  progress.exams = [{ date: new Date().toISOString(), total, correct, passed }]
    .concat(progress.exams).slice(0, 20);
  saveProgress();
}

const questionsOf = (theme) => QUESTIONS.filter((q) => q.theme === theme);

function themeStats() {
  return THEMES.map((t) => {
    const qs = questionsOf(t.id);
    let seen = 0, attempts = 0, correct = 0;
    for (const q of qs) {
      const s = progress.questions[q.id];
      if (!s) continue;
      seen++; attempts += s.seen; correct += s.correct;
    }
    return { theme: t.id, total: qs.length, seen, accuracy: attempts ? correct / attempts : 0 };
  });
}
function globalStats() {
  const all = Object.values(progress.questions);
  const attempts = all.reduce((n, s) => n + s.seen, 0);
  const correct = all.reduce((n, s) => n + s.correct, 0);
  return {
    seen: all.length,
    total: QUESTIONS.length,
    attempts,
    accuracy: attempts ? correct / attempts : 0,
    mastered: all.filter((s) => s.lastCorrect).length,
    exams: progress.exams,
    examsPassed: progress.exams.filter((e) => e.passed).length,
  };
}
const reviewIds = () =>
  QUESTIONS.filter((q) => progress.questions[q.id] && !progress.questions[q.id].lastCorrect)
    .map((q) => q.id);

/* ── Constitution des séries ─────────────────────────────────────────────── */
function prepare(q) {
  const correct = q.choices[q.answer];
  const choices = shuffle(q.choices);
  return { ...q, choices, answer: choices.indexOf(correct), critical: !!q.critical };
}
function buildExam() {
  const per = Math.floor(EXAM_LENGTH / THEMES.length);
  const picked = [], used = new Set();
  for (const t of THEMES)
    for (const q of shuffle(questionsOf(t.id)).slice(0, per)) { picked.push(q); used.add(q.id); }
  picked.push(...shuffle(QUESTIONS.filter((q) => !used.has(q.id)))
    .slice(0, Math.max(0, EXAM_LENGTH - picked.length)));
  return shuffle(picked).slice(0, EXAM_LENGTH);
}
function buildQuiz(mode) {
  if (mode === "exam") return buildExam().map(prepare);
  if (mode === "review") {
    const want = new Set(reviewIds());
    return shuffle(QUESTIONS.filter((q) => want.has(q.id))).map(prepare);
  }
  return shuffle(questionsOf(mode)).map(prepare);
}
const modeTitle = (m) =>
  m === "exam" ? "Examen blanc" : m === "review" ? "Mes erreurs"
    : (themeById[m] ? themeById[m].label : "Entraînement");

/* ── Thème clair / sombre ────────────────────────────────────────────────── */
const THEME_KEY = "permis-bateau/theme";
function applyTheme() {
  let t = null;
  try { t = localStorage.getItem(THEME_KEY); } catch {}
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
function cycleTheme() {
  let t = null;
  try { t = localStorage.getItem(THEME_KEY); } catch {}
  const next = t === "light" ? "dark" : t === "dark" ? null : "light";
  try { next ? localStorage.setItem(THEME_KEY, next) : localStorage.removeItem(THEME_KEY); } catch {}
  applyTheme();
  render();
}
function themeLabel() {
  let t = null;
  try { t = localStorage.getItem(THEME_KEY); } catch {}
  return t === "light" ? "☀️" : t === "dark" ? "🌙" : "◐";
}
applyTheme();

/* ── Fragments réutilisables ─────────────────────────────────────────────── */
const bar = (v, color, thin) =>
  `<div class="bar${thin ? " thin" : ""}"><i style="width:${pct(v)}%${color ? ";background:" + color : ""}"></i></div>`;

function accuracyColor(stat) {
  if (!stat || stat.seen === 0) return "var(--border)";
  if (stat.accuracy >= 0.8) return "var(--success)";
  if (stat.accuracy >= 0.5) return "var(--warning)";
  return "var(--danger)";
}

function topbar(title, backHref) {
  return `<div class="topbar">
    ${backHref ? `<button class="iconbtn" data-go="${esc(backHref)}" aria-label="Retour">←</button>` : ""}
    <h2>${esc(title)}</h2>
    <button class="iconbtn" data-theme-toggle aria-label="Changer de thème">${themeLabel()}</button>
  </div>`;
}

/* ── Session de quiz ─────────────────────────────────────────────────────── */
let quiz = null;

function startQuiz(mode) {
  quiz = { mode, questions: buildQuiz(mode), index: 0, chosen: null, answers: [], done: false };
}

function viewQuiz(mode) {
  if (!quiz || quiz.mode !== mode) startQuiz(mode);

  if (quiz.questions.length === 0) {
    return `${topbar(modeTitle(mode), "#/entrainement")}
      <h3>Rien à réviser</h3>
      <p class="muted">Cette série est vide. Travaillez d’abord quelques questions pour alimenter vos révisions.</p>
      <button class="btn secondary" data-go="#/entrainement">Retour</button>`;
  }

  if (quiz.done) return viewResult(mode);

  const q = quiz.questions[quiz.index];
  const revealed = quiz.chosen !== null;
  const letters = ["A", "B", "C", "D", "E", "F"];

  return `${topbar(modeTitle(mode), "#/entrainement")}
  <div class="row between">
    <p class="eyebrow">Question ${quiz.index + 1} / ${quiz.questions.length}</p>
    <p class="eyebrow">${esc(themeById[q.theme].label)}</p>
  </div>
  ${bar((quiz.index + (revealed ? 1 : 0)) / quiz.questions.length, null, true)}
  ${q.critical ? `<p class="tag">Question de sécurité · à ne pas rater</p>` : ""}
  <h3>${esc(q.prompt)}</h3>
  <div class="stack-md">
    ${q.choices.map((c, i) => {
      let cls = "opt";
      if (revealed && i === q.answer) cls += " correct";
      else if (revealed && i === quiz.chosen) cls += " wrong";
      return `<button class="${cls}" data-choice="${i}" ${revealed ? "disabled" : ""}>
        <span class="letter">${letters[i] || i + 1}</span><span class="grow">${esc(c)}</span>
      </button>`;
    }).join("")}
  </div>
  ${revealed ? `<div class="card">
    <h4 style="color:${quiz.chosen === q.answer ? "var(--success)" : "var(--danger)"}">
      ${quiz.chosen === q.answer ? "Bonne réponse" : "Réponse incorrecte"}</h4>
    <p class="small muted">${esc(q.explanation)}</p>
  </div>` : ""}
  <button class="btn" data-next ${revealed ? "" : "disabled"}>
    ${quiz.index + 1 < quiz.questions.length ? "Question suivante" : "Voir le résultat"}</button>`;
}

function viewResult(mode) {
  const total = quiz.questions.length;
  const correct = quiz.answers.filter((a) => a.correct).length;
  const errors = total - correct;
  const criticalMissed = quiz.answers.filter((a) => !a.correct && a.question.critical);
  const isExam = mode === "exam";
  const passed = isExam ? errors <= EXAM_MAX_ERRORS : errors === 0;
  const missed = quiz.answers.filter((a) => !a.correct);

  return `${topbar(modeTitle(mode), "#/entrainement")}
  <div class="card">
    <p class="eyebrow">Résultat</p>
    <h1 class="num">${correct} / ${total}</h1>
    ${bar(total ? correct / total : 0, passed ? "var(--success)" : "var(--danger)")}
    ${isExam ? `<div style="background:${passed ? "var(--success-surface)" : "var(--danger-surface)"};
        padding:var(--sp-lg);border-radius:var(--r-md);display:flex;flex-direction:column;gap:var(--sp-xs)">
      <h4 style="color:${passed ? "var(--success)" : "var(--danger)"}">${passed ? "Admis" : "Refusé"}</h4>
      <p class="small muted">${errors} faute${plural(errors)} sur ${EXAM_MAX_ERRORS} autorisées${
        criticalMissed.length ? ` · dont ${criticalMissed.length} sur une question de sécurité` : ""}.</p>
    </div>` : ""}
  </div>

  ${missed.length ? `<p class="eyebrow">À revoir</p>
    ${missed.map((a) => `<div class="card">
      <p class="eyebrow">${esc(themeById[a.question.theme].label)}${a.question.critical ? " · sécurité" : ""}</p>
      <h4>${esc(a.question.prompt)}</h4>
      <p class="small" style="color:var(--success)">Bonne réponse : ${esc(a.question.choices[a.question.answer])}</p>
      <p class="small muted">${esc(a.question.explanation)}</p>
    </div>`).join("")}` : ""}

  <button class="btn" data-restart>Recommencer</button>
  <button class="btn secondary" data-go="#/entrainement">Terminer</button>`;
}

/* ── Routage ─────────────────────────────────────────────────────────────── */
const TABS = [
  { href: "#/", ic: "⚓️", label: "Accueil" },
  { href: "#/cours", ic: "📘", label: "Cours" },
  { href: "#/entrainement", ic: "🎯", label: "Entraînement" },
  { href: "#/progres", ic: "📈", label: "Progrès" },
];

function route() {
  const raw = (location.hash || "#/").slice(1);
  const parts = raw.split("/").filter(Boolean);
  if (parts.length === 0) return { name: "home" };
  if (parts[0] === "cours") return parts[1] ? { name: "lesson", id: parts[1] } : { name: "cours" };
  if (parts[0] === "entrainement") return { name: "entrainement" };
  if (parts[0] === "progres") return { name: "progres" };
  if (parts[0] === "quiz" && parts[1]) return { name: "quiz", mode: parts[1] };
  return { name: "home" };
}

function render() {
  const r = route();
  const view = document.getElementById("view");
  const nav = document.getElementById("nav");
  const fullscreen = r.name === "lesson" || r.name === "quiz";

  if (r.name !== "quiz") quiz = null;

  view.innerHTML =
    r.name === "home" ? viewHome() :
    r.name === "cours" ? viewCours() :
    r.name === "lesson" ? viewLesson(r.id) :
    r.name === "entrainement" ? viewEntrainement() :
    r.name === "progres" ? viewProgres() :
    viewQuiz(r.mode);

  view.classList.toggle("no-nav", fullscreen);
  view.classList.toggle("has-topbar", fullscreen);
  nav.classList.toggle("hidden", fullscreen);

  const active = "#" + (r.name === "home" ? "/" : "/" + (r.name === "lesson" ? "cours" : r.name));
  nav.innerHTML = TABS.map((t) =>
    `<a href="${t.href}"${t.href === active ? ' aria-current="page"' : ""}>
       <span class="ic">${t.ic}</span><span>${t.label}</span></a>`).join("");

  document.getElementById("view").scrollIntoView({ block: "start" });
  window.scrollTo(0, 0);
}

/* ── Interactions ────────────────────────────────────────────────────────── */
document.addEventListener("click", (event) => {
  const el = event.target.closest("[data-go],[data-choice],[data-next],[data-restart],[data-reset],[data-theme-toggle]");
  if (!el || el.hasAttribute("disabled")) return;

  if (el.hasAttribute("data-theme-toggle")) return cycleTheme();
  if (el.hasAttribute("data-go")) { location.hash = el.getAttribute("data-go"); return; }

  if (el.hasAttribute("data-choice")) {
    if (!quiz || quiz.chosen !== null) return;
    const i = Number(el.getAttribute("data-choice"));
    const q = quiz.questions[quiz.index];
    const correct = i === q.answer;
    quiz.chosen = i;
    quiz.answers.push({ question: q, chosen: i, correct });
    recordAnswer(q.id, correct);
    if (navigator.vibrate) navigator.vibrate(correct ? 12 : [12, 60, 12]);
    render();
    return;
  }

  if (el.hasAttribute("data-next")) {
    if (!quiz) return;
    if (quiz.index + 1 < quiz.questions.length) { quiz.index++; quiz.chosen = null; }
    else {
      if (quiz.mode === "exam") {
        const total = quiz.questions.length;
        const correct = quiz.answers.filter((a) => a.correct).length;
        recordExam(total, correct, total - correct <= EXAM_MAX_ERRORS);
      }
      quiz.done = true;
    }
    render();
    return;
  }

  if (el.hasAttribute("data-restart")) { startQuiz(quiz.mode); render(); return; }

  if (el.hasAttribute("data-reset")) {
    if (confirm("Effacer toute votre progression ? Cette action est irréversible.")) {
      progress = structuredClone(EMPTY);
      try { localStorage.removeItem(KEY); } catch {}
      render();
    }
  }
});

window.addEventListener("hashchange", render);
render();
</script>
